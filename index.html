<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#7c3aed" />
<title>Dance Teacher Toolkit</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="appbar">
    <span class="appbar-title" id="appbar-title">Music &amp; Count</span>
  </header>

  <main id="main">
    <section id="screen-music" class="screen active">
      <div class="card player-card">
        <div class="song-row">
          <select id="song-select" class="song-select">
            <option value="">No song loaded</option>
          </select>
          <label class="btn btn-small" for="song-file">+ Load</label>
          <input type="file" id="song-file" accept="audio/*" hidden />
          <button id="btn-delete-song" class="btn btn-small btn-danger" title="Delete this song">🗑</button>
        </div>

        <div class="waveform-wrap">
          <canvas id="waveform" height="130"></canvas>
          <div id="loop-region" class="loop-region" hidden></div>
          <div id="loop-in-marker" class="loop-marker" hidden><span class="loop-marker-label">In</span></div>
          <div id="loop-out-marker" class="loop-marker" hidden><span class="loop-marker-label">Out</span></div>
          <div id="playhead" class="playhead" hidden></div>
          <div id="scrub-marker" class="scrub-marker" hidden></div>
          <div id="scrub-tooltip" class="scrub-tooltip" hidden>0:00</div>
        </div>

        <div class="time-row">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>

        <div class="transport-row">
          <button id="btn-loop-start" class="btn btn-ghost" title="Set the loop's start point here">Set In</button>
          <button id="btn-play" class="btn btn-play" disabled>▶</button>
          <button id="btn-loop-end" class="btn btn-ghost" title="Set the loop's end point here">Set Out</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title">🎚️ Practice settings</div>

        <div class="loop-toggle-row">
          <label class="switch">
            <input type="checkbox" id="loop-enabled" />
            <span>Loop selected region</span>
          </label>
          <button id="btn-clear-loop" class="btn btn-text">Clear loop</button>
        </div>

        <div class="speed-row">
          <span class="speed-label">Speed: <b id="speed-value">100%</b></span>
          <input type="range" id="speed-slider" min="50" max="100" value="100" step="5" />
          <div class="speed-presets">
            <button class="chip speed-chip" data-speed="50">50%</button>
            <button class="chip speed-chip" data-speed="60">60%</button>
            <button class="chip speed-chip" data-speed="70">70%</button>
            <button class="chip speed-chip" data-speed="80">80%</button>
            <button class="chip speed-chip" data-speed="90">90%</button>
            <button class="chip speed-chip" data-speed="100">100%</button>
          </div>
        </div>
      </div>

      <div class="card tag-section">
        <div class="section-title">🔢 Count markers</div>
        <div class="tag-label">Tap a count to drop a marker at the playhead</div>
        <div class="tag-buttons">
          <button class="chip tag-num" data-count="1">1</button>
          <button class="chip tag-num" data-count="2">2</button>
          <button class="chip tag-num" data-count="3">3</button>
          <button class="chip tag-num" data-count="4">4</button>
          <button class="chip tag-num" data-count="5">5</button>
          <button class="chip tag-num" data-count="6">6</button>
          <button class="chip tag-num" data-count="7">7</button>
          <button class="chip tag-num" data-count="8">8</button>
        </div>
        <div class="tag-custom-row">
          <input type="text" id="tag-custom-label" placeholder="Custom label e.g. 'Chorus'" />
          <button id="btn-tag-custom" class="btn btn-small">Add</button>
        </div>
        <div id="tag-list" class="tag-list"></div>
      </div>

      <audio id="audio-player" preload="auto"></audio>
    </section>

    <section id="screen-progress" class="screen">
      <div id="progress-root"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-screen="music">
      <span class="tab-icon">🎵</span><span>Music &amp; Count</span>
    </button>
    <button class="tab" data-screen="progress">
      <span class="tab-icon">📋</span><span>Progress</span>
    </button>
  </nav>

  <button id="btn-back-to-top" class="back-to-top" hidden title="Back to top">↑</button>

  <script src="js/vendor/jspdf.umd.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/music.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
