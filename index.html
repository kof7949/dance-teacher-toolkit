<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#7c3aed" />
<title>Dance Teacher Toolkit</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css?v=116" />
</head>
<body>
  <div id="lock-screen" class="lock-screen">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Dance Teacher Toolkit</div>
    <div class="lock-subtitle">Enter the passcode to continue</div>
    <div class="lock-dots" id="lock-dots">
      <span class="lock-dot"></span>
      <span class="lock-dot"></span>
      <span class="lock-dot"></span>
      <span class="lock-dot"></span>
    </div>
    <div class="lock-keypad">
      <button class="lock-key" data-key="1">1</button>
      <button class="lock-key" data-key="2">2</button>
      <button class="lock-key" data-key="3">3</button>
      <button class="lock-key" data-key="4">4</button>
      <button class="lock-key" data-key="5">5</button>
      <button class="lock-key" data-key="6">6</button>
      <button class="lock-key" data-key="7">7</button>
      <button class="lock-key" data-key="8">8</button>
      <button class="lock-key" data-key="9">9</button>
      <span></span>
      <button class="lock-key" data-key="0">0</button>
      <button class="lock-key lock-key-back" data-key="back">⌫</button>
    </div>
  </div>

  <header class="appbar">
    <span class="appbar-title" id="appbar-title">Music &amp; Count</span>
  </header>

  <main id="main">
    <section id="screen-progress" class="screen">
      <div id="progress-root"></div>
    </section>

    <section id="screen-music" class="screen active">
      <div class="card player-card">
        <div class="song-row">
          <select id="song-select" class="song-select">
            <option value="">No song loaded</option>
          </select>
          <label class="btn btn-small" for="song-file">+ Load</label>
          <input type="file" id="song-file" accept="audio/*,video/*" hidden />
          <button id="btn-delete-song" class="btn btn-small btn-danger" title="Delete this song">🗑</button>
        </div>

        <div class="waveform-wrap">
          <canvas id="waveform" height="130"></canvas>
          <video id="video-player" class="video-player" playsinline hidden></video>
          <div id="video-progress-track" class="video-progress-track" hidden>
            <div id="video-progress-fill" class="video-progress-fill"></div>
            <div id="video-progress-handle" class="video-progress-handle"></div>
          </div>
          <div id="loop-region" class="loop-region" hidden></div>
          <div id="loop-in-marker" class="loop-marker" hidden><span class="loop-marker-label">In</span></div>
          <div id="loop-out-marker" class="loop-marker" hidden><span class="loop-marker-label">Out</span></div>
          <div id="playhead" class="playhead" hidden></div>
          <div id="scrub-marker" class="scrub-marker" hidden></div>
          <div id="scrub-tooltip" class="scrub-tooltip" hidden>0:00</div>
        </div>

        <div id="video-controls-row" class="video-controls-row" hidden>
          <button id="btn-mirror-video" class="btn btn-small btn-ghost" type="button" title="Mirror the video"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="3 3"/><path d="M8 8 4 12l4 4"/><path d="M16 8l4 4-4 4"/></svg></button>
          <button id="btn-video-fullscreen" class="btn btn-small btn-ghost" type="button" title="Full screen">⛶</button>
        </div>

        <div class="time-row">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>

        <div class="transport-row">
          <button id="btn-loop-start" class="btn btn-ghost" title="Set the loop's start point here">Set In</button>
          <button id="btn-play" class="btn btn-play" disabled>▶</button>
          <button id="btn-loop-end" class="btn btn-ghost" title="Set the loop's end point here">Set Out</button>
        </div>

        <div class="nudge-row">
          <div class="nudge-group">
            <span class="nudge-label">In <b id="loop-in-time">--</b></span>
            <button class="btn btn-small btn-nudge" id="btn-nudge-in-minus" data-nudge="in" data-delta="-0.1" disabled>−0.1s</button>
            <button class="btn btn-small btn-nudge" id="btn-nudge-in-plus" data-nudge="in" data-delta="0.1" disabled>+0.1s</button>
          </div>
          <div class="nudge-group">
            <span class="nudge-label">Out <b id="loop-out-time">--</b></span>
            <button class="btn btn-small btn-nudge" id="btn-nudge-out-minus" data-nudge="out" data-delta="-0.1" disabled>−0.1s</button>
            <button class="btn btn-small btn-nudge" id="btn-nudge-out-plus" data-nudge="out" data-delta="0.1" disabled>+0.1s</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">🎚️ Practice settings</div>

        <div class="loop-toggle-row">
          <label class="switch">
            <input type="checkbox" id="loop-enabled" />
            <span>Loop selected region</span>
          </label>
          <button id="btn-clear-loop" class="btn btn-text">Clear loop</button>
        </div>

        <div class="speed-row">
          <span class="speed-label">Speed: <b id="speed-value">100%</b></span>
          <input type="range" id="speed-slider" min="50" max="100" value="100" step="5" />
          <div class="speed-presets">
            <button class="chip speed-chip" data-speed="50">50%</button>
            <button class="chip speed-chip" data-speed="60">60%</button>
            <button class="chip speed-chip" data-speed="70">70%</button>
            <button class="chip speed-chip" data-speed="80">80%</button>
            <button class="chip speed-chip" data-speed="90">90%</button>
            <button class="chip speed-chip" data-speed="100">100%</button>
          </div>
        </div>
      </div>

      <div class="card tag-section">
        <div class="section-title">🔢 Count markers</div>
        <div class="tag-label">Tap a count to drop a marker at the playhead</div>
        <div class="tag-buttons">
          <button class="chip tag-num" data-count="1">1</button>
          <button class="chip tag-num" data-count="2">2</button>
          <button class="chip tag-num" data-count="3">3</button>
          <button class="chip tag-num" data-count="4">4</button>
          <button class="chip tag-num" data-count="5">5</button>
          <button class="chip tag-num" data-count="6">6</button>
          <button class="chip tag-num" data-count="7">7</button>
          <button class="chip tag-num" data-count="8">8</button>
        </div>
        <div class="tag-custom-row">
          <input type="text" id="tag-custom-label" placeholder="Custom label e.g. 'Chorus'" />
          <button id="btn-tag-custom" class="btn btn-small">Add</button>
        </div>
        <div id="tag-list" class="tag-list"></div>
        <button id="btn-toggle-beathud" class="btn btn-small" type="button">👁 Show floating counter</button>
      </div>

      <audio id="audio-player" preload="auto"></audio>

      <div id="beat-hud" class="beat-hud" hidden>
        <span id="beat-hud-value">–</span>
      </div>
      <div id="beat-hud-panel" class="beat-hud-panel" hidden>
        <div class="beat-hud-panel-title">Jump to a count</div>
        <div id="beat-hud-panel-list" class="beat-hud-panel-list"></div>
      </div>
    </section>

    <section id="screen-metronome" class="screen">
      <div id="metronome-root"></div>
    </section>

    <section id="screen-countdown" class="screen">
      <div id="countdown-root"></div>
    </section>

    <section id="screen-formation" class="screen">
      <div id="formation-root"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab" data-screen="progress">
      <span class="tab-icon">📋</span><span>Progress</span>
    </button>
    <button class="tab active" data-screen="music">
      <span class="tab-icon">🎵</span><span>Music &amp; Count</span>
    </button>
    <button class="tab" data-screen="metronome">
      <span class="tab-icon">🥁</span><span>Metronome</span>
    </button>
    <button class="tab" data-screen="countdown">
      <span class="tab-icon">⏱️</span><span>Countdown</span>
    </button>
    <button class="tab" data-screen="formation">
      <span class="tab-icon">🕺</span><span>Formation</span>
    </button>
  </nav>

  <button id="btn-back-to-top" class="back-to-top" hidden title="Back to top">↑</button>

  <div id="formation-fullscreen-shell" class="formation-fullscreen-shell" hidden>
    <div class="fs-topbar">
      <button class="btn btn-small btn-ghost" data-action="exit-fullscreen">✕ Close</button>
      <span class="fs-rotate-hint" id="fs-rotate-hint" hidden>↻ Rotate your phone to landscape</span>
    </div>
    <div id="formation-fullscreen-slot" class="fs-body"></div>
  </div>

  <div id="video-fullscreen-shell" class="video-fullscreen-shell" hidden>
    <div class="vfs-topbar">
      <span class="vfs-rotate-hint" id="vfs-rotate-hint" hidden>↻ Rotate your phone to landscape</span>
    </div>
    <div id="video-fullscreen-slot" class="vfs-body">
      <div class="vfs-controls">
        <button id="fs-btn-play" class="btn-video-overlay-ctrl" type="button">▶</button>
        <span id="fs-time" class="vfs-time">0:00 / 0:00</span>
        <div style="flex:1"></div>
        <button id="fs-btn-speed" class="btn-video-overlay-ctrl" type="button">1.0x</button>
        <button id="fs-btn-mirror" class="btn-video-overlay-ctrl" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="21" stroke-dasharray="3 3"/><path d="M8 8 4 12l4 4"/><path d="M16 8l4 4-4 4"/></svg></button>
        <button class="btn-video-overlay-ctrl" data-action="exit-video-fullscreen" type="button" title="Exit fullscreen">✕</button>
      </div>
    </div>
  </div>

  <script src="js/lock.js?v=116"></script>
  <script src="js/vendor/jspdf.umd.min.js"></script>
  <script src="js/db.js?v=116"></script>
  <script src="js/seed.js?v=116"></script>
  <script src="js/music.js?v=116"></script>
  <script src="js/progress.js?v=116"></script>
  <script src="js/formation.js?v=116"></script>
  <script src="js/metronome.js?v=116"></script>
  <script src="js/countdown.js?v=116"></script>
  <script src="js/app.js?v=116"></script>
</body>
</html>
